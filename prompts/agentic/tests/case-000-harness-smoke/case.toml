schema = "pcp-case/v0"
name = "harness-smoke"

# End-to-end smoke: harness plumbing (workspace, artifact capture, checks)
# plus a trivial LLM round-trip through the tunnel. Requires a model server.
setup = """
{
  echo "user: $(id)"
  echo "cwd:  $(pwd)"
  echo "node: $(node --version)"
  echo "npm:  $(npm --version)"
  echo "rust: $(rustc --version)"
  echo "cargo: $(cargo --version)"
  echo "clang: $(clang --version | head -1)"
  echo "python: $(python3 --version)"
  echo "java:  $(java -version 2>&1 | head -1)"
  echo "pi:    $(pi --version)"
  echo "git:   $(git --version)"
  echo "strace: $(strace -V 2>&1 | head -1)"
} > toolchain.txt 2>&1
"""

prompt = """Who was the famous King of England who had six wives, two of whom he
had executed? Answer with just the name, nothing else."""

[[checks]]
name = "toolchain-versions"
run = """
test -f "$PCP_ARTIFACTS/workspace/toolchain.txt" \
  && grep -q '^node: v'    "$PCP_ARTIFACTS/workspace/toolchain.txt" \
  && grep -q '^pi: '       "$PCP_ARTIFACTS/workspace/toolchain.txt" \
  && grep -q '^strace: '   "$PCP_ARTIFACTS/workspace/toolchain.txt"
"""

[[checks]]
name = "llm-says-henry"
transcript = "includes"
pattern = "henry"
scope = "assistant"

[[checks]]
name = "llm-says-viii"
transcript = "includes"
pattern = "viii|8th|eighth"
regex = true
scope = "assistant"
